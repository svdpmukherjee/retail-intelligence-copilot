# Local pgvector Postgres for dev/CI ($0). Throwaway credentials, bound to localhost only.
# Usage: docker compose -f infra/docker-compose.yml up -d
# then DATABASE_URL=postgresql://rag:rag@localhost:5432/rag
services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
