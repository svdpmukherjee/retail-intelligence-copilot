<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" role="img" aria-labelledby="title desc"><title id="title">2 · The process</title><desc id="desc">Spec → human approval: Decompose work into reviewable sub-modules. Build → test → document: Verify each part, then the integrated module. Human approval → close: Record decisions, evidence and next-session context</desc><rect width="720" height="370" rx="18" fill="#f8fafc"/><text x="28" y="42" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">2 · The process</text>
