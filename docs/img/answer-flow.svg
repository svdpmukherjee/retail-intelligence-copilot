<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="title desc">
<title id="title">How an answer is produced</title>
<desc id="desc">Batch preparation produces Gold tables, Silver reviews and a hybrid search index. At query time a capability-aware planner proposes tasks, validated against role permissions before scoped SQL and review/document access. Selected-product source checks and retrieved evidence feed synthesis and citation checks; calculated summaries feed the answer directly. Audit and optional Langfuse traces are separate operator surfaces. Data source labels on tool cards refer to the preparation outputs above.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.heading{font-size:23px;font-weight:700}.label{font-size:18px;font-weight:700}.body{font-size:17px;fill:#334155}.note{font-size:16px;fill:#475569}.wire{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:6 5}</style>
