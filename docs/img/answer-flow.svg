<text x="42" y="944" class="heading">3 · Storage, deployment and operator plane</text>
<text x="42" y="979" class="body">Docker Compose → PostgreSQL / pgvector: search index + full-text search + conversation memory + audit</text>
<text x="42" y="1011" class="body">PostgreSQL audit → React admin: sources, model / tier rationale, tokens, cost, latency; best-effort writes</text>
<text x="42" y="1043" class="body">Langfuse → execution-stage traces: redacted input / output, timings and usage; enabled through configuration</text>
<text x="42" y="1075" class="note">API / UI / Spark run on host · Langfuse uses a separate self-hosted Docker stack or hosted endpoint</text>
