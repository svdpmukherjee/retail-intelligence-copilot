<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">Retail copilot: technologies and answer flow</title>
<desc id="desc">Reviews and separate product metadata feed Spark/Delta medallion ETL. FastAPI loads PostgreSQL memory; a code policy chooses OpenRouter Gemma models per task. A large-tier planner precedes Pydantic validation, server access policy and intent routing to DuckDB SQL, review RAG and document RAG. Checked evidence feeds synthesis and cited answers. Docker Compose hosts PostgreSQL for retrieval, memory and audit. Langfuse provides execution traces through a separately configured endpoint.</desc>
